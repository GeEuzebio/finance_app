name: finance_app
description: >
  App de finanças pessoais focado em previsibilidade de saldo futuro.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado: único mecanismo de estado do app (ADR 0001) — providers reativos
  # para streams do Supabase e para o resultado da engine de projeção.
  flutter_riverpod: ^2.5.1
  riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Persistência (ADR 0005) — Postgres gerenciado, compartilhado entre os
  # dois usuários do app sem precisar de sync manual entre dispositivos.
  supabase_flutter: ^2.17.1

  # DI (ADR 0003) — service locator resolvido uma vez em main.dart.
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Either<Failure, T> — hierarquia de erro própria sem exceptions
  # cruzando a fronteira domain/data (docs/ARCHITECTURE.md §6).
  fpdart: ^1.1.0

  # Entidades imutáveis com copyWith/== geradas — reduz boilerplate manual
  # nas 8 entidades de domínio (Account, Transaction, etc.).
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Formatação de moeda (centavos -> "R$ 1.234,56") e datas em pt-BR na UI.
  intl: ^0.19.0

  # Gera ids client-side para as entidades (uuid v4), sem depender do
  # Postgres para atribuir a chave primária antes do insert.
  uuid: ^4.6.0

  # Tipografia consistente entre Android e iOS (Inter) — a identidade
  # visual é única nos dois SOs (ver PRODUCT.md), não a fonte de sistema
  # de cada plataforma (docs/DESIGN.md).
  google_fonts: ^8.2.1

  # Preferências locais do app (tema, horizonte de projeção, meta de
  # economia) — únicos dados que não são compartilhados entre os dois
  # usuários via Supabase (M7, #019).
  shared_preferences: ^2.5.5

  # Lembrete diário de check-in (M7, #022) — agenda uma notificação local
  # recorrente no horário escolhido em Configurações, sem servidor.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # Importação de extrato OFX/CSV (M7, #023 — docs/adr/0006-open-finance.md
  # escolheu esse caminho em vez de integração bancária direta).
  file_picker: ^12.0.0

  # Bottom nav animada (pedido explícito do usuário, M7) — substitui a
  # NavigationBar padrão do Material em main.dart.
  animated_bottom_navigation_bar: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Codegen compartilhado por riverpod_generator, injectable e freezed —
  # um único runner (`dart run build_runner build`).
  build_runner: ^2.4.11

  # Geração dos providers @riverpod.
  riverpod_generator: ^2.4.0

  # Geração do container de DI (injection.config.dart) a partir das
  # anotações @LazySingleton/@Injectable.
  injectable_generator: ^2.6.1

  # Geração das classes freezed (entidades imutáveis).
  freezed: ^2.5.2

  # Regras de lint oficiais do time Flutter — sem regras customizadas
  # próprias enquanto o time é pequeno (YAGNI).
  flutter_lints: ^4.0.0

  # Mocks/fakes para testar repositórios e casos de uso isolados da
  # camada data, sem depender de uma conexão real com o Supabase.
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
